<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>CRM Prospek</title>
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<style>
  /* ============ Reset ============ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--surface);
    color: var(--on-surface);
    padding-bottom: 96px;
    overflow-x: hidden;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  input, select, textarea { font-family: inherit; }
  ::-webkit-scrollbar { display: none; }
  svg { display: block; }

  /* ============ Tokens — monokrom murni ============ */
  :root {
    --ink: #111111;
    --ink-soft: #3A3A3A;
    --on-surface: #111111;
    --on-surface-variant: #6B6B6B;
    --outline: #D6D6D6;
    --outline-strong: #B5B5B5;

    --surface: #FFFFFF;
    --surface-dim: #F1F1F1;
    --surface-container-low: #F7F7F7;
    --surface-container: #EFEFEF;
    --surface-container-high: #E6E6E6;

    --wa: #111111; /* tombol WA tetap monokrom, dibedakan lewat isi solid + icon */

    --el1: 0 1px 2px rgba(0,0,0,0.06), 0 1px 3px 1px rgba(0,0,0,0.05);
    --el2: 0 1px 2px rgba(0,0,0,0.08), 0 2px 6px 2px rgba(0,0,0,0.06);
    --el3: 0 4px 10px 2px rgba(0,0,0,0.14), 0 1px 3px rgba(0,0,0,0.18);
  }

  .icon { width: 20px; height: 20px; flex: none; }
  .icon-sm { width: 16px; height: 16px; }
  .icon-lg { width: 36px; height: 36px; }

  .app { max-width: 480px; margin: 0 auto; }

  /* ============ Top App Bar ============ */
  .topbar {
    background: var(--surface);
    padding: 22px 16px 12px;
    position: sticky;
    top: 0;
    z-index: 20;
    border-bottom: 1px solid transparent;
  }
  .topbar-headline {
    font-size: 22px;
    font-weight: 600;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar-sub {
    font-size: 13px;
    color: var(--on-surface-variant);
    margin-top: 3px;
  }
  .install-btn {
    display: none;
    align-items: center;
    gap: 6px;
    position: absolute;
    top: 22px;
    right: 16px;
    height: 32px;
    padding: 0 12px;
    border: 1px solid var(--ink);
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    background: var(--surface);
  }
  .install-btn.show { display: inline-flex; }
  .topbar { position: sticky; }

  /* ============ Stat cards ============ */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 4px 16px 16px;
  }
  .stat-card {
    background: var(--surface-container-low);
    border: 1px solid var(--outline);
    border-radius: 16px;
    padding: 12px 8px;
    text-align: center;
  }
  .stat-card b { display: block; font-size: 20px; font-weight: 600; line-height: 1.2; color: var(--ink); }
  .stat-card span { font-size: 11px; color: var(--on-surface-variant); display: block; margin-top: 2px; }
  /* status dibedakan lewat border, bukan warna */
  .stat-card.followup { border-style: dashed; }
  .stat-card.closing { background: var(--ink); border-color: var(--ink); }
  .stat-card.closing b, .stat-card.closing span { color: #fff; }

  /* ============ Search field ============ */
  .search-box {
    padding: 0 16px;
    margin-bottom: 12px;
    position: relative;
  }
  .search-box .icon {
    position: absolute; left: 30px; top: 50%; transform: translateY(-50%);
    color: var(--on-surface-variant); pointer-events: none;
  }
  .search-box input {
    width: 100%;
    height: 48px;
    padding: 0 16px 0 46px;
    border-radius: 24px;
    border: 1px solid var(--outline);
    background: var(--surface-container-low);
    color: var(--on-surface);
    font-size: 15px;
    outline: none;
  }
  .search-box input:focus { border-color: var(--ink); }
  .search-box input::placeholder { color: var(--on-surface-variant); }

  /* ============ Filter chips ============ */
  .filters {
    display: flex;
    gap: 8px;
    padding: 0 16px 16px;
    overflow-x: auto;
    white-space: nowrap;
  }
  .chip {
    flex: none;
    height: 34px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--outline-strong);
    background: var(--surface);
    color: var(--on-surface-variant);
    padding: 0 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    transition: background .15s, border-color .15s, color .15s;
  }
  .chip .icon { display: none; }
  .chip.active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }
  .chip.active .icon { display: inline-block; }

  /* ============ List & Cards ============ */
  .list { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--outline);
    border-radius: 16px;
    padding: 14px;
    box-shadow: var(--el1);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card-top { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--ink); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 15px; flex: none;
  }
  .card-info { flex: 1; min-width: 0; }
  .card-info .name {
    font-weight: 600; font-size: 15px; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-info .phone { font-size: 13px; color: var(--on-surface-variant); margin-top: 1px; }
  .card-info .date { font-size: 11.5px; color: var(--on-surface-variant); margin-top: 2px; display: flex; align-items: center; gap: 4px; }
  .card-info .date .icon-sm { width: 13px; height: 13px; }

  /* Badge status — dibedakan lewat isi/outline/pola, bukan warna */
  .badge {
    font-size: 11px; font-weight: 600;
    padding: 4px 10px; border-radius: 8px; flex: none; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 4px;
    border: 1px solid var(--ink);
  }
  .badge.baru { background: transparent; color: var(--ink); }
  .badge.followup { background: transparent; color: var(--ink); border-style: dashed; }
  .badge.closing { background: var(--ink); color: #fff; }
  .badge.gagal { background: transparent; color: var(--on-surface-variant); border-color: var(--outline-strong); text-decoration: line-through; }

  .note {
    font-size: 13px; color: var(--ink-soft);
    background: var(--surface-container-low);
    border: 1px solid var(--outline);
    padding: 9px 11px; border-radius: 12px;
    line-height: 1.45;
  }

  .actions { display: flex; gap: 8px; }
  .actions button {
    flex: 1;
    height: 38px;
    border-radius: 10px;
    font-size: 12.5px;
    font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    border: 1px solid var(--outline-strong);
  }
  .actions .btn-wa {
    background: var(--ink); color: #fff; border-color: var(--ink); flex: 1.5;
  }
  .actions .btn-edit { color: var(--ink); max-width: 72px; }
  .actions .btn-del { color: var(--on-surface-variant); max-width: 72px; }

  .empty-state {
    text-align: center;
    padding: 72px 24px;
    color: var(--on-surface-variant);
    font-size: 14px;
    line-height: 1.6;
  }
  .empty-state .icon-lg { margin: 0 auto 12px; color: var(--outline-strong); }

  /* ============ FAB (extended) ============ */
  .fab {
    position: fixed;
    bottom: max(20px, env(safe-area-inset-bottom));
    right: 20px;
    height: 56px;
    padding: 0 20px 0 16px;
    border-radius: 16px;
    background: var(--ink);
    color: #fff;
    box-shadow: var(--el3);
    display: flex; align-items: center; gap: 8px;
    z-index: 30;
    transition: transform .1s, box-shadow .1s;
    font-size: 14.5px;
    font-weight: 600;
  }
  .fab:active { transform: scale(0.96); box-shadow: var(--el1); }

  /* ============ Bottom sheet ============ */
  .backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 40;
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-width: 480px;
    margin: 0 auto;
    background: var(--surface);
    border-radius: 28px 28px 0 0;
    z-index: 50;
    max-height: 90vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform .3s cubic-bezier(.2,0,0,1);
    padding-bottom: env(safe-area-inset-bottom);
    box-shadow: var(--el3);
  }
  .sheet.open { transform: translateY(0); }

  .sheet-handle {
    width: 32px; height: 4px; background: var(--outline-strong); border-radius: 999px;
    margin: 12px auto 8px;
  }
  .sheet-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 20px 12px;
  }
  .sheet-header h3 { font-size: 17px; font-weight: 600; color: var(--ink); }
  .sheet-close {
    width: 40px; height: 40px; border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    color: var(--on-surface-variant);
  }
  .sheet-close:active { background: var(--surface-container-high); }

  .sheet-body { padding: 4px 20px 24px; }
  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 12.5px; font-weight: 500;
    color: var(--on-surface-variant); margin-bottom: 6px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    height: 52px;
    padding: 0 14px;
    border-radius: 12px;
    border: 1px solid var(--outline-strong);
    background: var(--surface);
    color: var(--on-surface);
    font-size: 15px;
    outline: none;
  }
  .field textarea { height: auto; min-height: 72px; padding: 12px 14px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--ink);
    outline: 1px solid var(--ink);
  }
  .field-error {
    font-size: 12px; color: var(--ink); font-weight: 600; margin-top: 6px; display: none;
  }
  .field-error.show { display: block; }

  .sheet-actions { display: flex; gap: 10px; margin-top: 4px; }
  .sheet-actions button {
    flex: 1;
    height: 48px;
    border-radius: 24px;
    font-size: 14.5px;
    font-weight: 600;
  }
  .btn-cancel { background: transparent; color: var(--ink); border: 1px solid var(--outline-strong); }
  .btn-save { background: var(--ink); color: #fff; }
  .btn-save:active { opacity: 0.85; }

  /* ============ Snackbar ============ */
  .snackbar {
    position: fixed;
    bottom: max(90px, calc(env(safe-area-inset-bottom) + 90px));
    left: 16px; right: 16px;
    max-width: 448px;
    margin: 0 auto;
    background: var(--ink);
    color: #fff;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 13.5px;
    z-index: 60;
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    box-shadow: var(--el2);
  }
  /* ============ Date filter ============ */
  .date-filter-toggle {
    display: flex; align-items: center; gap: 6px;
    margin: 0 16px 12px;
    padding: 8px 14px;
    border: 1px solid var(--outline-strong);
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    background: var(--surface);
    width: calc(100% - 32px);
    justify-content: space-between;
  }
  .date-filter-toggle .left { display: flex; align-items: center; gap: 6px; }
  .date-filter-toggle .chevron { transition: transform .2s; }
  .date-filter-toggle.open .chevron { transform: rotate(180deg); }
  .date-filter-panel {
    display: none;
    padding: 0 16px 14px;
    gap: 10px;
  }
  .date-filter-panel.open { display: flex; }
  .date-filter-panel .df-field { flex: 1; }
  .date-filter-panel label { display: block; font-size: 11px; color: var(--on-surface-variant); margin-bottom: 4px; }
  .date-filter-panel input {
    width: 100%; height: 42px; padding: 0 10px;
    border-radius: 10px; border: 1px solid var(--outline-strong);
    font-size: 13px; background: var(--surface); color: var(--on-surface);
  }
  .date-filter-clear {
    align-self: flex-end;
    height: 42px; padding: 0 12px;
    border: 1px solid var(--outline-strong); border-radius: 10px;
    font-size: 12px; color: var(--on-surface-variant); flex: none;
  }
</style>
</head>
<body>

<div class="app">

  <div class="topbar">
    <button class="install-btn" id="install-btn">
      <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Install
    </button>
    <div class="topbar-headline">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      CRM Prospek
    </div>
    <div class="topbar-sub">Kelola kontak &amp; follow up langsung ke WhatsApp</div>
  </div>

  <div class="stats">
    <div class="stat-card"><b id="stat-total">0</b><span>Total</span></div>
    <div class="stat-card followup"><b id="stat-followup">0</b><span>Follow up</span></div>
    <div class="stat-card closing"><b id="stat-closing">0</b><span>Closing</span></div>
  </div>

  <div class="search-box">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search" type="text" placeholder="Cari nama atau nomor...">
  </div>

  <div class="filters" id="filters">
    <button class="chip active" data-f="semua">
      <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      Semua
    </button>
    <button class="chip" data-f="baru">
      <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      Baru
    </button>
    <button class="chip" data-f="followup">
      <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      Follow up
    </button>
    <button class="chip" data-f="closing">
      <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      Closing
    </button>
    <button class="chip" data-f="gagal">
      <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      Gagal
    </button>
  </div>

  <button class="date-filter-toggle" id="date-toggle" onclick="toggleDateFilter()">
    <span class="left">
      <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span id="date-toggle-label">Filter tanggal ditambahkan</span>
    </span>
    <svg class="icon icon-sm chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
  </button>
  <div class="date-filter-panel" id="date-panel">
    <div class="df-field">
      <label>Dari</label>
      <input type="date" id="date-from">
    </div>
    <div class="df-field">
      <label>Sampai</label>
      <input type="date" id="date-to">
    </div>
    <button class="date-filter-clear" onclick="clearDateFilter()">Reset</button>
  </div>

  <div class="list" id="list"></div>

</div>

<button class="fab" onclick="openSheet()" aria-label="Tambah prospek">
  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  Prospek
</button>

<div class="backdrop" id="backdrop" onclick="closeSheet()"></div>

<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <h3 id="sheet-title">Tambah prospek</h3>
    <button class="sheet-close" onclick="closeSheet()" aria-label="Tutup">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="sheet-body">
    <input type="hidden" id="f-id">

    <div class="field">
      <label>Nama</label>
      <input type="text" id="f-name" placeholder="Nama prospek">
    </div>

    <div class="field">
      <label>Nomor WhatsApp</label>
      <input type="text" id="f-phone" placeholder="08123456789" inputmode="numeric">
      <div class="field-error" id="f-phone-err">Masukkan nomor yang valid (minimal 9 digit)</div>
    </div>

    <div class="field">
      <label>Status</label>
      <select id="f-status">
        <option value="baru">Baru</option>
        <option value="followup">Follow up</option>
        <option value="closing">Closing</option>
        <option value="gagal">Gagal</option>
      </select>
    </div>

    <div class="field">
      <label>Tanggal ditambahkan</label>
      <input type="date" id="f-date">
    </div>

    <div class="field">
      <label>Catatan</label>
      <textarea id="f-note" placeholder="Sumber prospek, kebutuhan, dll."></textarea>
    </div>

    <div class="sheet-actions">
      <button class="btn-cancel" onclick="closeSheet()">Batal</button>
      <button class="btn-save" onclick="saveContact()">Simpan</button>
    </div>
  </div>
</div>

<div class="snackbar" id="toast"></div>

<script>
(function(){
  var STORAGE_KEY = 'crm_prospek_data';
  var contacts = [];
  try { contacts = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e){ contacts = []; }
  var activeFilter = 'semua';
  var searchTerm = '';
  var dateFrom = '';
  var dateTo = '';

  var ICON_WA = '<svg class="icon icon-sm" viewBox="0 0 24 24" fill="currentColor"><path d="M17.6 6.32A8.86 8.86 0 0 0 12.05 4a8.94 8.94 0 0 0-7.75 13.4L3 21l3.7-1.28a8.9 8.9 0 0 0 5.36 1.78 8.94 8.94 0 0 0 8.94-8.94 8.86 8.86 0 0 0-3.4-6.24Zm-5.55 13.72a7.4 7.4 0 0 1-3.78-1.03l-.27-.16-2.24.78.75-2.2-.18-.28a7.43 7.43 0 1 1 13.87-3.75 7.44 7.44 0 0 1-8.15 6.64Zm4.08-5.55c-.22-.11-1.31-.65-1.51-.72-.2-.07-.35-.11-.5.11-.15.22-.57.72-.7.87-.13.15-.26.16-.48.05a6.1 6.1 0 0 1-1.8-1.11 6.75 6.75 0 0 1-1.24-1.55c-.13-.22 0-.34.1-.45.1-.1.22-.26.33-.39.11-.13.15-.22.22-.37.07-.15.04-.28-.02-.39-.06-.11-.5-1.2-.68-1.65-.18-.43-.36-.37-.5-.38h-.43c-.15 0-.39.06-.6.28-.2.22-.79.77-.79 1.87 0 1.1.81 2.17.92 2.32.11.15 1.6 2.44 3.87 3.42.54.23.96.37 1.29.48.54.17 1.03.15 1.42.09.43-.06 1.31-.53 1.5-1.05.18-.51.18-.95.13-1.04-.05-.1-.2-.15-.42-.26Z"/></svg>';
  var ICON_EMPTY = '<svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><circle cx="11" cy="9.5" r="2"/><path d="M7.5 14a4 4 0 0 1 7 0"/></svg>';

  function persist(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(contacts)); }

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2000);
  }

  function initials(name){
    var parts = name.trim().split(/\s+/).slice(0, 2);
    return parts.map(function(w){ return w[0] ? w[0].toUpperCase() : ''; }).join('');
  }

  function statusMeta(s){
    var map = {
      baru: { label: 'Baru', cls: 'baru' },
      followup: { label: 'Follow up', cls: 'followup' },
      closing: { label: 'Closing', cls: 'closing' },
      gagal: { label: 'Gagal', cls: 'gagal' }
    };
    return map[s] || { label: s, cls: 'baru' };
  }

  function cleanPhone(phone){
    var p = phone.replace(/[^0-9]/g, '');
    if(p.charAt(0) === '0') p = '62' + p.slice(1);
    else if(p.indexOf('62') !== 0) p = '62' + p;
    return p;
  }

  function isValidPhone(phone){
    return phone.replace(/[^0-9]/g, '').length >= 9;
  }

  function waLink(phone){ return 'https://wa.me/' + cleanPhone(phone); }

  function todayStr(){
    var d = new Date();
    var m = (d.getMonth()+1).toString().padStart(2,'0');
    var day = d.getDate().toString().padStart(2,'0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  function formatDateDisplay(dateStr){
    if(!dateStr) return '';
    var parts = dateStr.split('-');
    if(parts.length !== 3) return dateStr;
    var bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    return parseInt(parts[2],10) + ' ' + bulan[parseInt(parts[1],10)-1] + ' ' + parts[0];
  }

  function escapeHtml(str){
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function render(){
    var list = document.getElementById('list');
    var data = contacts.filter(function(c){
      var matchFilter = activeFilter === 'semua' || c.status === activeFilter;
      var matchSearch = !searchTerm ||
        c.name.toLowerCase().indexOf(searchTerm) !== -1 ||
        c.phone.indexOf(searchTerm) !== -1;
      var matchDate = true;
      if(dateFrom && c.date && c.date < dateFrom) matchDate = false;
      if(dateTo && c.date && c.date > dateTo) matchDate = false;
      return matchFilter && matchSearch && matchDate;
    });

    renderStats();

    if(data.length === 0){
      list.innerHTML = '<div class="empty-state">' + ICON_EMPTY + 'Belum ada kontak prospek.<br>Tap tombol Prospek untuk menambahkan.</div>';
      return;
    }

    list.innerHTML = data.map(function(c){
      var meta = statusMeta(c.status);
      var noteHtml = c.note ? '<div class="note">' + escapeHtml(c.note) + '</div>' : '';
      return (
        '<div class="card">' +
          '<div class="card-top">' +
            '<div class="avatar">' + initials(c.name) + '</div>' +
            '<div class="card-info">' +
              '<div class="name">' + escapeHtml(c.name) + '</div>' +
              '<div class="phone">' + escapeHtml(c.phone) + '</div>' +
              (c.date ? '<div class="date"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>' + formatDateDisplay(c.date) + '</div>' : '') +
            '</div>' +
            '<span class="badge ' + meta.cls + '">' + meta.label + '</span>' +
          '</div>' +
          noteHtml +
          '<div class="actions">' +
            '<button class="btn-wa" onclick="openWA(\'' + c.id + '\')">' + ICON_WA + 'WhatsApp</button>' +
            '<button class="btn-edit" onclick="editContact(\'' + c.id + '\')">Edit</button>' +
            '<button class="btn-del" onclick="deleteContact(\'' + c.id + '\')">Hapus</button>' +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

  function renderStats(){
    document.getElementById('stat-total').textContent = contacts.length;
    document.getElementById('stat-followup').textContent = contacts.filter(function(c){ return c.status === 'followup'; }).length;
    document.getElementById('stat-closing').textContent = contacts.filter(function(c){ return c.status === 'closing'; }).length;
  }

  window.openWA = function(id){
    var c = contacts.find(function(x){ return x.id === id; });
    if(!c) return;
    window.open(waLink(c.phone), '_blank');
  };

  window.openSheet = function(id){
    document.getElementById('f-phone-err').classList.remove('show');
    if(id){
      var c = contacts.find(function(x){ return x.id === id; });
      document.getElementById('sheet-title').textContent = 'Edit prospek';
      document.getElementById('f-id').value = c.id;
      document.getElementById('f-name').value = c.name;
      document.getElementById('f-phone').value = c.phone;
      document.getElementById('f-status').value = c.status;
      document.getElementById('f-date').value = c.date || todayStr();
      document.getElementById('f-note').value = c.note || '';
    } else {
      document.getElementById('sheet-title').textContent = 'Tambah prospek';
      document.getElementById('f-id').value = '';
      document.getElementById('f-name').value = '';
      document.getElementById('f-phone').value = '';
      document.getElementById('f-status').value = 'baru';
      document.getElementById('f-date').value = todayStr();
      document.getElementById('f-note').value = '';
    }
    document.getElementById('backdrop').classList.add('open');
    document.getElementById('sheet').classList.add('open');
    document.body.style.overflow = 'hidden';
  };

  window.closeSheet = function(){
    document.getElementById('backdrop').classList.remove('open');
    document.getElementById('sheet').classList.remove('open');
    document.body.style.overflow = '';
  };

  window.editContact = function(id){ window.openSheet(id); };

  window.saveContact = function(){
    var name = document.getElementById('f-name').value.trim();
    var phone = document.getElementById('f-phone').value.trim();
    var status = document.getElementById('f-status').value;
    var date = document.getElementById('f-date').value || todayStr();
    var note = document.getElementById('f-note').value.trim();
    var id = document.getElementById('f-id').value;
    var errEl = document.getElementById('f-phone-err');

    if(!name || !phone){
      showToast('Nama dan nomor wajib diisi');
      return;
    }
    if(!isValidPhone(phone)){
      errEl.classList.add('show');
      return;
    }
    errEl.classList.remove('show');

    if(id){
      var c = contacts.find(function(x){ return x.id === id; });
      c.name = name; c.phone = phone; c.status = status; c.note = note; c.date = date;
      showToast('Kontak diperbarui');
    } else {
      contacts.unshift({ id: Date.now().toString(), name: name, phone: phone, status: status, note: note, date: date });
      showToast('Kontak ditambahkan');
    }
    persist();
    window.closeSheet();
    render();
  };

  window.deleteContact = function(id){
    if(!confirm('Hapus kontak ini?')) return;
    contacts = contacts.filter(function(x){ return x.id !== id; });
    persist();
    render();
    showToast('Kontak dihapus');
  };

  document.getElementById('filters').addEventListener('click', function(e){
    var btn = e.target.closest('.chip');
    if(!btn) return;
    document.querySelectorAll('.chip').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    activeFilter = btn.dataset.f;
    render();
  });

  document.getElementById('search').addEventListener('input', function(e){
    searchTerm = e.target.value.trim().toLowerCase();
    render();
  });

  window.toggleDateFilter = function(){
    document.getElementById('date-toggle').classList.toggle('open');
    document.getElementById('date-panel').classList.toggle('open');
  };

  window.clearDateFilter = function(){
    dateFrom = ''; dateTo = '';
    document.getElementById('date-from').value = '';
    document.getElementById('date-to').value = '';
    updateDateToggleLabel();
    render();
  };

  function updateDateToggleLabel(){
    var label = document.getElementById('date-toggle-label');
    if(dateFrom || dateTo){
      var fromTxt = dateFrom ? formatDateDisplay(dateFrom) : '...';
      var toTxt = dateTo ? formatDateDisplay(dateTo) : '...';
      label.textContent = fromTxt + ' – ' + toTxt;
    } else {
      label.textContent = 'Filter tanggal ditambahkan';
    }
  }

  document.getElementById('date-from').addEventListener('change', function(e){
    dateFrom = e.target.value;
    updateDateToggleLabel();
    render();
  });

  document.getElementById('date-to').addEventListener('change', function(e){
    dateTo = e.target.value;
    updateDateToggleLabel();
    render();
  });

  document.getElementById('f-phone').addEventListener('input', function(){
    document.getElementById('f-phone-err').classList.remove('show');
  });

  // ===== PWA: registrasi service worker (file sw.js asli) =====
  // Catatan: SW hanya bisa aktif jika diakses via https:// atau localhost,
  // bukan dibuka langsung dari file:// (keterbatasan browser, bukan bug).
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js')
        .then(function (reg) {
          console.log('Service worker terdaftar:', reg.scope);
        })
        .catch(function (err) {
          console.log('Service worker gagal didaftarkan:', err);
        });
    });
  }

  // ===== PWA: prompt instalasi custom =====
  var deferredPrompt = null;
  var installBtn = document.getElementById('install-btn');

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    if (installBtn) installBtn.classList.add('show');
  });

  if (installBtn) {
    installBtn.addEventListener('click', function () {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function () {
        deferredPrompt = null;
        installBtn.classList.remove('show');
      });
    });
  }

  window.addEventListener('appinstalled', function () {
    if (installBtn) installBtn.classList.remove('show');
    showToast('Aplikasi berhasil di-install');
  });

  render();
})();
</script>
</body>
</html>
